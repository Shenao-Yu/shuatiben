<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>刷题本</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('shuati-theme') || '"auto"');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <aside id="side" class="side"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="搜索题目或答案内容" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button class="icon-btn" id="settingsBtn" aria-label="设置" title="设置">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M19.4 13.5l1.5 1.2-1.6 2.8-1.8-.6a7.6 7.6 0 0 1-1.9 1.1l-.3 1.9h-3.2l-.3-1.9a7.6 7.6 0 0 1-1.9-1.1l-1.8.6-1.6-2.8 1.5-1.2a7.7 7.7 0 0 1 0-2.9L3.1 9.4l1.6-2.8 1.8.6a7.6 7.6 0 0 1 1.9-1.1l.3-1.9h3.2l.3 1.9a7.6 7.6 0 0 1 1.9 1.1l1.8-.6 1.6 2.8-1.5 1.2a7.7 7.7 0 0 1 0 2.9z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <main id="view" class="view">
      <div class="loading">正在加载题库…</div>
    </main>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
